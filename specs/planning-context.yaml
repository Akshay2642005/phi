# Planning Context — Phase 2: Wire the Runtime
# Written by: scope-work (planning spine step 1 of 3)
# Date: 2026-07-17

feature_name: "Phase 2 — Wire the Runtime"
problem_statement: >
  Phase 1 completed the entire engine internals — WorkflowContext, execution
  loop, parallel execution, cancellation, timeouts, retries, diagnostics, and
  observability — totaling 135 tests. But the engine is disconnected from the
  application entry point. `cargo run` builds AppContainer and logs "ready"
  without executing anything. The RuntimePlugin (PlannerSkill + WebSearchSkill)
  exists but is never registered. The EventBus emits into the void.

  Phase 2 wires it all together: CLI command, RuntimePlugin integration,
  parallel retry fix, expanded tool skills, and end-to-end ReAct integration
  tests. After Phase 2, `cargo run "what's the weather?"` actually works.

constraints:
  - "Generic Workflow<I> must remain generic — no ReAct coupling in core"
  - "All existing public APIs backward-compatible"
  - "petgraph encapsulated behind WorkflowGraph — no other module imports it"
  - "No new external crate dependencies unless essential"
  - "No HTTP server, no WASM, no new binary targets"
  - "Single crate preserved"

out_of_scope:
  - "Phase 3 — Additional LLM providers (OpenAI, Anthropic, Groq)"
  - "Phase 4 — Official skill library"
  - "Phase 5 — Workflow DSL serialization"
  - "Phase 6 — Persistence / checkpointing"
  - "Phase 7 — Scheduling (cron, webhook, queue)"
  - "Phase 8 — Distributed execution"
  - "HTTP server / API endpoints"
  - "Dynamic plugin loading / discovery"
  - "WASM compilation support"
  - "Cargo publish"

key_decisions:
  - decision: "Phase 2 has 5 stories (e02s01 through e02s05)"
    rationale: "Each story is a vertical slice: merge, CLI, retry fix, tool skills, integration test."

  - decision: "e02s01 — Merge Phase 1 to main first"
    rationale: >
      The branch e01s07-workflow-context has 9 commits (Phase 1 complete).
      Merge it before layering Phase 2 code to keep history clean.

  - decision: "e02s02 — CLI uses clap or manual arg parsing"
    rationale: >
      Currently no CLI argument parsing. Use std::env::args for simplicity
      to avoid adding a clap dependency. The goal is: `cargo run "goal here"`.

  - decision: "e02s03 — Fix spawned task retry by calling run_with_policy"
    rationale: >
      Currently spawned tasks in execute_ready call skill.execute() directly,
      bypassing run_with_policy. The fix wraps each spawned execution in a
      run_with_policy call so retry/predicate/backoff apply.

  - decision: "e02s04 — Tool skills are sync wrappers with anyhow"
    rationale: >
      file_read, file_write, shell_command, calculator are simple skills that
      don't need LLM access. They use std::fs, std::process, or basic math.

  - decision: "e02s05 — Mock LLM returns predefined PlanOutput sequence"
    rationale: >
      Integration test needs deterministic planner output. A mock LlmService
      returns a canned sequence of PlanOutput JSON responses, one per loop
      iteration.
