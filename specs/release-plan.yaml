# Release plan — AI Workflow Engine
# Release index with WSJF-ordered epic list.

release:
  version: "0.2.0" # Mirror — the real version is determined by
  bump_hint: minor # semantic-release at merge time.
  codename: "wired-runtime"
  description: "Phase 2 — Wire the Runtime (CLI, ReAct loop, tool skills, retry fix)"

epics:
  - id: e01
    title: "Phase 1 — Engine Completion"
    description: "Complete the engine internals: WorkflowContext, execution loop, parallel exec, cancellation, timeouts, retries, diagnostics, observability, and comprehensive tests."
    bcps: 45
    stories:
      - id: e01s07
        title: "WorkflowContext — artifacts, metadata, event bus, metrics"
        bcps: 5
      - id: e01s08
        title: "Execution loop — initialize → tick → update → finalize"
        bcps: 5
      - id: e01s09
        title: "Parallel execution — tokio::spawn + JoinSet"
        bcps: 8
      - id: e01s10
        title: "Cancellation — wire token + ctrl+c"
        bcps: 3
      - id: e01s11
        title: "Timeout hierarchy — node ≤ workflow ≤ global"
        bcps: 5
      - id: e01s12
        title: "Retry engine — linear, exponential, jitter"
        bcps: 5
      - id: e01s13
        title: "Execution diagnostics — timing, retry count, errors"
        bcps: 3
      - id: e01s14
        title: "Observability — full event emission"
        bcps: 3
      - id: e01s15
        title: "Engine tests — comprehensive integration tests"
        bcps: 8

  - id: e02
    title: "Phase 2 — Wire the Runtime"
    description: "Connect the engine to main(): CLI command, RuntimePlugin wiring, parallel retry fix, expanded tool skills, and end-to-end ReAct integration tests."
    bcps: 28
    stories:
      - id: e02s01
        title: "Merge Phase 1 to main"
        bcps: 2
      - id: e02s02
        title: "CLI `run` command — wire RuntimePlugin, EventBus, execute goal"
        bcps: 8
      - id: e02s03
        title: "Parallel task retry — fix spawned tasks to use run_with_policy"
        bcps: 5
      - id: e02s04
        title: "Core tool skills — file_read, file_write, shell, calculator"
        bcps: 8
      - id: e02s05
        title: "ReAct integration test — mock LLM end-to-end"
        bcps: 5
