# Scope — e04: Tavily Web Search Migration
# Written by: scope-work (planning spine step 1 of 3)
# Date: 2026-08-05

core_value: >
  Give the ReAct planner real search content to reason over by replacing the
  DuckDuckGo Instant Answer stub with the Tavily Search API — an AI-agent-grade
  search API that returns full-text snippets and an AI-generated answer.

summary: >
  The `web_search` tool skill currently calls the DuckDuckGo Instant Answer
  API, which only handles short keyword lookups and returns thin snippets —
  often empty for conversational queries. The ReAct planner therefore gets
  weak signal when it searches, which degrades multi-step reasoning.

  e04 swaps the provider to Tavily: a `POST https://api.tavily.com/search`
  call with an API key, returning `answer` (AI-generated) plus `results[]`
  with title/url/content. The API key flows through `AppConfig` (env var
  `TAVILY_API_KEY`, optional in Vault-backed secrets) into `RuntimePlugin`
  and then into `WebSearchSkill`. Docs, planner prompt tips, and the env
  example are updated to match.

in_scope:
  - id: e04s01
    what: "WebSearchSkill speaks Tavily — POST /search, parse answer + results, map to WebSearchOutput (v2.0.0)"
  - id: e04s02
    what: "TAVILY_API_KEY plumbing — AppConfig field, Vault OllamaSecrets field, RuntimePlugin constructor, main.rs"
  - id: e04s03
    what: "Docs & env example — .env.example, README, AGENTS.md, CLAUDE.md, CONVENTIONS.md, tech-stack.md, docs/getting-started.md"
  - id: e04s04
    what: "Regression tests — response parsing, no-results path, empty-key bail, HTTP error path"

out_of_scope:
  - "Other search providers (Brave, SerpAPI, Google CSE) — deferred; Tavily satisfies the requirement"
  - "Tavily search_depth=crawler or max_results>5 tuning — keep basic depth for the free tier"
  - "Caching/rate-limit handling for Tavily — covered by existing retry policy in core"
  - "Non-web search tools (news, images, academic search)"
  - "Changing the ReAct loop or planner schema — only the query tip text changes"

constraints:
  - "No new external crate dependencies — use existing reqwest + serde_json"
  - "WebSearchOutput public shape preserved (WebSearchOutput::from_raw used by tests)"
  - "TAVILY_API_KEY optional at startup for from_env (matches existing graceful-degradation convention)"
  - "SkillDefinition version bump to 2.0.0 only (no breaking interface changes)"
  - "Single crate, no HTTP server, no new binary targets"

success_criteria:
  - "web_search calls api.tavily.com with the key, parses answer + top-5 results"
  - "Empty TAVILY_API_KEY produces a clear actionable error, not a panic"
  - "All 161 existing tests still pass; new tests cover Tavily parsing paths"
  - "No DuckDuckGo references remain in src/, docs/, or env example"

references:
  - specs/adr/ADR-0002-tavily-web-search.md
  - specs/bugs/BUG-20260725T1619-infinite-react-loop.md (motivation: search quality feeds the loop)
  - docs/getting-started.md, README.md
