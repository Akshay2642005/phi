# Story: e02s02 — CLI `run` command
# Parse a goal from CLI args, wire RuntimePlugin into AppContainer,
# attach EventBus, execute ReAct workflow, display final answer.

story_id: e02s02
title: CLI run command
bcps: 8
status: not_started

tasks:
