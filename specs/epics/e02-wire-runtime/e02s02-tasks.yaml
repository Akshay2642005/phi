    description: "Add simple CLI arg parsing in main.rs: cargo run <goal> reads goal string from args"
    verify: "cargo run -- 'test' 2>&1 | head -5 | grep -q 'Running workflow' && echo 'OK' || echo 'NEEDS WORK'"
    status: not_started

  - id: e02s02-t002
    description: "Wire RuntimePlugin into AppContainer - expose register or integrate into build()"
    verify: "grep -q 'RuntimePlugin' src/bootstrap/container.rs && echo 'OK' || echo 'MISSING'"
    status: not_started

  - id: e02s02-t003
    description: "Wire EventBus into engine - create bus in main(), attach to WorkflowEngine, console subscriber"
    verify: "grep -q 'EventBus' src/main.rs && echo 'OK' || echo 'MISSING'"
    status: not_started

  - id: e02s02-t004
    description: "Add console event subscriber - human-readable lines for lifecycle events"
