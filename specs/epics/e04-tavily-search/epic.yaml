# Epic: e04 — Phase 4: Tavily Web Search Migration
# Swap web_search from DuckDuckGo Instant Answers to the Tavily Search API.

id: e04
title: "Phase 4 — Tavily web search migration"
description: >
  The web_search tool skill currently calls the DuckDuckGo Instant Answer API,
  which returns thin snippets and fails on conversational queries. This epic
  swaps the provider to Tavily (POST https://api.tavily.com/search), plumbs a
  TAVILY_API_KEY through config/Vault/plugin/main, updates the planner prompt
  tip and all docs + env example, and adds regression tests for the new
  parsing/error paths. The implementation was drafted in the working tree on
  master (uncommitted); this epic verifies, completes, and lands it.

total_bcps: 8

