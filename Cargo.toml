[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
erased-serde = "0.4"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig = "0.39"
dashmap = "6"
petgraph = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
vaultrs = "0.8"
vaultrs-login = "0.2"
